; node-temperature — Temperature node configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = node-temperature
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[node]
update_interval_ms = 3000
; Where the kernel exposes DS18B20 probes. Needs `dtoverlay=w1-gpio,gpiopin=<N>`
; in /boot/firmware/config.txt (see README "Wiring"). If the directory is
; absent the node simply publishes no 1-Wire sensors.
w1_base_path = /sys/bus/w1/devices
; Pi SoC thermal zone, published as a built-in sensor with source = cpu.
cpu_enabled = true
cpu_id = cpu
cpu_name = Pi CPU
cpu_unit = C
cpu_thermal_zone = /sys/class/thermal/thermal_zone0/temp
; Where dashboard edits (name/unit) persist, one <id>.json per sensor. Must be
; writable and, under Docker, a mounted volume or edits are lost on recreate.
; Default: <install dir>/state
; state_dir = /var/lib/node-temperature
; Default display unit (C or F) for probes with no [sensor.<id>] section.
default_unit = C

; PER-PROBE SECTIONS (override in config.ini, one per DS18B20):
;
;   [sensor.fridge]
;   serial = 28-0000075a1b2c   ; required: the probe's 1-Wire id
;   name = Fridge              ; optional, default = the sensor id
;   unit = C                   ; optional, default = node.default_unit
;
; The section suffix (`fridge`) is the topic id: renewvan/temperature/fridge/...
; Probes on the bus with no section are still published, with their serial
; as id and name, so a freshly wired probe shows up without editing config.
; `name` and `unit` are only defaults: edits made from the dashboard (the
; <field>/set topics) are persisted in state/<id>.json and win over this file.
