[project]
name = "driver-temperature"
# Fixed placeholder: nothing reads this. The git release tag is the only version
# source (stamped into the image as DEVICE_VERSION).
version = "0.0.0"
description = "1-Wire (DS18B20) temperature sensing device for the renewvan bus"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_temperature*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
